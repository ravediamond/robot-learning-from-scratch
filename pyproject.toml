[project]
name = "robot-learning-from-scratch"
version = "0.1.0"
description = "8-week hands-on path: PyTorch, VLA, JEPA world models, interview prep"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pytest>=8.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "pyarrow>=14",
    "transformers>=4.40",   # week 3: check your GPT-2 against Hugging Face
]

[project.optional-dependencies]
video = ["av>=12"]          # week 2: decode your SO-101 videos (uv sync --extra video)

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["weeks", "drills"]
